[project]
name = "plantsentinel"
version = "0.1.0"
description = "Private, offline AI for industrial failure diagnosis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "pydantic",
    "pydantic-settings",
    "pandas",
    "openpyxl",
    "python-docx",
    "pymupdf",
    "chromadb",
    "scikit-learn>=1.3",
    "xgboost",
    "shap",
    "langgraph",
    "langchain-ollama",
    "presidio-analyzer",
    "presidio-anonymizer",
    "psutil",
    "httpx",
    "python-multipart",
]

[project.optional-dependencies]
# Heavy OCR stack kept optional so CI and quick setups stay fast.
ocr = ["paddleocr", "paddlepaddle"]

[dependency-groups]
dev = ["ruff", "pytest", "pytest-cov", "pre-commit", "mypy"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app", "check_no_ai_coauthor"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "scripts"]
addopts = "-m 'not integration'"
markers = ["integration: needs a real Ollama model / GPU (skipped by default)"]
