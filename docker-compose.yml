# PlantSentinel: four services on an internal-only network.
#
#   browser -> gateway (127.0.0.1:8080) -> backend -> ollama (GPU)
#                                                  -> chroma
#
# `plant` is internal: backend, chroma and ollama have no route off the machine.
# Only the gateway also sits on `edge`, which is what lets Docker publish its port.
#
# First run, to fill the model volume (either one):
#   docker compose --profile setup run --rm model-copy   # from the host Ollama, offline
#   docker compose --profile setup run --rm model-pull   # download, needs internet
# Then:
#   docker compose up -d --build
# Prove the isolation:
#   docker compose exec backend python /app/scripts/check_isolation.py

name: plantsentinel

# Pinned: the version GPU passthrough and isolation were tested with.
x-ollama-image: &ollama-image ollama/ollama:0.40.16

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # The UI: run `npm run build` in frontend/ (with VITE_USE_MOCK=false) first.
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks: [plant, edge]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      OLLAMA_HOST: http://ollama:11434
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      DB_PATH: /app/state/plantsentinel.db
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct-q3_K_M}
      VISION_MODEL: ${VISION_MODEL:-qwen2.5vl:3b}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      BLOCK_EGRESS: "true"
      ANONYMIZED_TELEMETRY: "False"
    volumes:
      - ./data:/app/data          # raw CSV, synthetic data, manuals, scans, uploads
      - ./models:/app/models      # trained XGBoost model and metrics
      - app_state:/app/state      # SQLite lives in a volume, not on the Windows bind mount
    networks: [plant]
    depends_on:
      ollama:
        condition: service_healthy
      chroma:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:1.5.9   # keep in step with chromadb in uv.lock
    environment:
      ANONYMIZED_TELEMETRY: "False"
    volumes:
      - chroma_data:/data
    networks: [plant]
    restart: unless-stopped

  ollama:
    image: *ollama-image
    gpus: all
    environment:
      OLLAMA_KEEP_ALIVE: 30m          # don't unload the model between demo questions
      OLLAMA_MAX_LOADED_MODELS: "2"   # LLM + embedder; the vision model swaps in at ingest
      # Fit a 6 GB card: one request at a time, cheaper attention and a quantised KV cache.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - ollama_models:/root/.ollama
    networks: [plant]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # One-off, offline: copies weights already pulled by the host Ollama into the named
  # volume (about 90 s). The host folder is read-only and is never used at runtime.
  # Override the source with OLLAMA_MODELS_SRC if your models live elsewhere.
  model-copy:
    profiles: [setup]
    image: *ollama-image
    network_mode: none
    volumes:
      - ${OLLAMA_MODELS_SRC:-${USERPROFILE:-${HOME}}/.ollama/models}:/src:ro
      - ollama_models:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -d /src/manifests ] || { echo "No Ollama models found in the source folder"; exit 1; }
        mkdir -p /root/.ollama/models
        cp -a /src/. /root/.ollama/models/
        du -sh /root/.ollama/models

  # One-off, online alternative: downloads the weights into the volume, then exits.
  # Use this only if the models are not already on the host.
  model-pull:
    profiles: [setup]
    image: *ollama-image
    volumes:
      - ollama_models:/root/.ollama
    networks: [edge]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        for m in ${LLM_MODEL:-qwen2.5:7b-instruct-q3_K_M} ${VISION_MODEL:-qwen2.5vl:3b} ${EMBED_MODEL:-nomic-embed-text} ${EXTRA_MODELS:-}; do
          ollama pull "$$m" || exit 1
        done
        ollama list

networks:
  plant:
    internal: true
  edge: {}

volumes:
  app_state:
  chroma_data:
  ollama_models:
